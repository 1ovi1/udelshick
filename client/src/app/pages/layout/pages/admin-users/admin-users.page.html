<section class="page">
  <h1 class="page-title">Пользователи</h1>

  <nz-content class="page-content">
    <div class="filter-buttons">
      <button
        nz-button
        [nzType]="activeTab() === 'all' ? 'primary' : 'default'"
        (click)="setTab('all')"
      >
        Все
      </button>
      <button
        nz-button
        [nzType]="activeTab() === 'candidate' ? 'primary' : 'default'"
        (click)="setTab('candidate')"
      >
        Кандидаты
      </button>
      <button
        nz-button
        [nzType]="activeTab() === 'company' ? 'primary' : 'default'"
        (click)="setTab('company')"
      >
        Компании
      </button>
    </div>

    <nz-table
      #usersTable
      [nzData]="displayedUsers()"
      [nzFrontPagination]="false"
      [nzTotal]="total()"
      [nzPageIndex]="pageIndex()"
      [nzPageSize]="pageSize()"
      [nzLoading]="isLoading()"
      [nzShowSizeChanger]="true"
      [nzPageSizeOptions]="[5, 10, 20, 50]"
      (nzQueryParams)="onQueryParamsChange($event)"
    >
      <thead>
        <tr>
          <th>Пользователь</th>
          <th>Почта</th>
          <th>Дата регистрации</th>
          <th>Статус</th>
          <th>Действия</th>
        </tr>
      </thead>

      <tbody>
        @for (item of usersTable.data; track item.authId) {
          <tr>
            <td>{{ item.name }}</td>
            <td>{{ item.email }}</td>
            <td>{{ formatDate(item.createdAt) }}</td>
            <td>
              <nz-tag [nzColor]="toStatusColor(item.status)">{{
                toStatusLabel(item.status)
              }}</nz-tag>
            </td>
            <td>
              <button
                nz-button
                nzType="link"
                nzDanger
                nz-popconfirm
                nzPopconfirmTitle="Удалить пользователя?"
                (nzOnConfirm)="deleteUser(item.authId)"
                [nzLoading]="isDeleting(item.authId)"
              >
                Удалить
              </button>
            </td>
          </tr>
        }
      </tbody>
    </nz-table>
  </nz-content>
</section>
