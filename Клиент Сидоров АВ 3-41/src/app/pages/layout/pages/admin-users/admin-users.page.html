<section class="page">
  <h1 class="page-title">Пользователи</h1>

  <nz-content class="page-content">
    <nz-tabs
      [nzSelectedIndex]="selectedTabIndex()"
      (nzSelectedIndexChange)="onTabIndexChange($event)"
    >
      @for (tab of tabs; track tab.key) {
        <nz-tab [nzTitle]="tab.title" />
      }
    </nz-tabs>

    <nz-table
      #usersTable
      [nzData]="displayedUsers()"
      [nzFrontPagination]="false"
      [nzTotal]="total()"
      [nzPageIndex]="pageIndex()"
      [nzPageSize]="pageSize()"
      [nzLoading]="isLoading()"
      [nzShowSizeChanger]="true"
      [nzPageSizeOptions]="[5, 10, 20, 50]"
      (nzQueryParams)="onQueryParamsChange($event)"
    >
      <thead>
        <tr>
          <th>Пользователь</th>
          <th>Почта</th>
          <th>Дата регистрации</th>
          <th>Статус</th>
          <th>Действия</th>
        </tr>
      </thead>

      <tbody>
        @for (item of usersTable.data; track item.authId) {
          <tr>
            <td>{{ item.name }}</td>
            <td>{{ item.email }}</td>
            <td>{{ formatDate(item.createdAt) }}</td>
            <td>
              <nz-tag [nzBordered]="false" [nzColor]="toStatusColor(item.status)">{{
                toStatusLabel(item.status)
              }}</nz-tag>
            </td>
            <td>
              <button
                nz-button
                nzType="link"
                nzDanger
                nz-popconfirm
                nzPopconfirmTitle="Удалить пользователя?"
                (nzOnConfirm)="deleteUser(item.authId)"
                [nzLoading]="isDeleting(item.authId)"
              >
                Удалить
              </button>
            </td>
          </tr>
        }
      </tbody>
    </nz-table>
  </nz-content>
</section>
